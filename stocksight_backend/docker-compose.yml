version: '3.9'

services:
  rest-api-service:
    build:
      context: ./rest-api-service
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: stocksight
      DB_USER: postgres
      DB_PASSWORD: postgres

  auth-service:
    build:
      context: ./auth-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: stocksight
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_INIT_MODE: ${DB_INIT_MODE:-always}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in .env}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-true}
      SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS_REQUIRED:-true}
      OTP_FROM: ${OTP_FROM:?Set OTP_FROM in .env}

  ai-service:
    build:
      context: ./ai-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: stocksight
      DB_USER: postgres
      DB_PASSWORD: postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: stocksight
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
