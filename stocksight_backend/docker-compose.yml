version: '3.9'

services:
  rest-api-service:
    build:
      context: ./rest-api-service
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: stocksight
      DB_USER: postgres
      DB_PASSWORD: postgres

  auth-service:
    build:
      context: ./auth-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: stocksight
      DB_USER: postgres
      DB_PASSWORD: postgres

  ai-service:
    build:
      context: ./ai-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: stocksight
      DB_USER: postgres
      DB_PASSWORD: postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: stocksight
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
