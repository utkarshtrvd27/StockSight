spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stocksight}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  jackson:
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
